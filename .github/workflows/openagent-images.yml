name: OpenAgent mailbox images

on:
  push:
    branches: [openagent]
    paths:
      - .github/workflows/openagent-images.yml
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - resources/**
      - openagent/**
  workflow_dispatch:

concurrency:
  group: openagent-mailbox-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: bash deploy/openagent-mailboxes/verify-build-inputs.sh
      - working-directory: openagent/gateway
        run: npm ci
      - working-directory: openagent/gateway
        run: npm test && npm run typecheck && npm run build

  publish:
    needs: verify-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stalwart
            image: ghcr.io/autonomy-cloud/mailboxes-stalwart
            context: .
            file: openagent/Dockerfile.stalwart
          - name: gateway
            image: ghcr.io/autonomy-cloud/openagent-mailbox-gateway
            context: openagent/gateway
            file: openagent/gateway/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=openagent
            type=sha,prefix=openagent-
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=openagent-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=openagent-${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
