name: OpenAgent mailbox images

# Promotion contract (matching autonomy-cloud/cast):
#   develop -> verification images only
#   stage   -> build, attest, sign, and scan immutable release candidates
#   release -> promote the exact stage images; never rebuild
on:
  push:
    branches: [develop, stage, release]
    paths:
      - .github/workflows/openagent-images.yml
      - .dockerignore
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - resources/**
      - openagent/**
      - deploy/openagent-mailboxes/**
  workflow_dispatch:

concurrency:
  group: openagent-mailbox-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: bash deploy/openagent-mailboxes/verify-build-inputs.sh
      - working-directory: openagent/gateway
        run: npm ci
      - working-directory: openagent/gateway
        run: npm test && npm run typecheck && npm run build

  publish:
    if: github.ref_name != 'release'
    needs: verify-gateway
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stalwart
            image: ghcr.io/autonomy-cloud/mailboxes-stalwart
            context: .
            file: openagent/Dockerfile.stalwart
          - name: gateway
            image: ghcr.io/autonomy-cloud/openagent-mailbox-gateway
            context: openagent/gateway
            file: openagent/gateway/Dockerfile
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.ref_name }}-${{ github.sha }}
            type=sha,prefix=${{ github.ref_name }}-
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=openagent-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=openagent-${{ matrix.name }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - if: github.ref_name == 'stage'
        uses: sigstore/cosign-installer@v3.9.2
      - name: Sign immutable stage candidate
        if: github.ref_name == 'stage'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "${{ matrix.image }}@${DIGEST}"
      - name: Scan immutable stage candidate
        if: github.ref_name == 'stage'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}@${{ steps.image.outputs.digest }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  promote-release:
    if: github.ref_name == 'release'
    needs: verify-gateway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        image:
          - ghcr.io/autonomy-cloud/mailboxes-stalwart
          - ghcr.io/autonomy-cloud/openagent-mailbox-gateway
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve the stage parent and prove tree identity
        id: source
        run: |
          set -euo pipefail
          test "$(git rev-list --parents -n1 HEAD | wc -w | tr -d ' ')" -ge 3
          stage_sha="$(git rev-parse HEAD^2)"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${stage_sha}^{tree}")"
          echo "sha=${stage_sha}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the stage image without rebuilding
        env:
          IMAGE: ${{ matrix.image }}
          STAGE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          source_ref="${IMAGE}:stage-${STAGE_SHA}"
          docker buildx imagetools inspect "${source_ref}" >/dev/null
          docker buildx imagetools create \
            --tag "${IMAGE}:release" \
            --tag "${IMAGE}:release-${GITHUB_SHA}" \
            "${source_ref}"
      - uses: sigstore/cosign-installer@v3.9.2
      - name: Sign the promoted immutable digest
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${IMAGE}:release" --format '{{json .Manifest}}' | jq -r .digest)"
          cosign sign --yes "${IMAGE}@${digest}"
