name: openagent-mailboxes

services:
  stalwart:
    image: autonomy-cloud/mailboxes-stalwart:openagent
    build:
      context: ..
      dockerfile: openagent/Dockerfile.stalwart
    entrypoint: ["/opt/openagent/stalwart-entrypoint.sh"]
    restart: unless-stopped
    environment:
      STALWART_RECOVERY_ADMIN: ${STALWART_ADMIN_USERNAME:-admin}:${STALWART_ADMIN_PASSWORD:?set STALWART_ADMIN_PASSWORD}
    ports:
      - "6401:8080"
      - "6425:25"
      - "6487:465"
      - "6493:993"
    volumes:
      - stalwart-config:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
      - ./stalwart-entrypoint.sh:/opt/openagent/stalwart-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-For: 127.0.0.1", "http://127.0.0.1:8080/healthz/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  identity-loopback:
    image: alpine/socat:1.8.0.3
    restart: unless-stopped
    network_mode: service:stalwart
    depends_on:
      stalwart:
        condition: service_started
    command:
      - -d
      - -d
      - TCP-LISTEN:6201,bind=127.0.0.1,fork,reuseaddr
      - TCP:host.docker.internal:6201

  gateway:
    build:
      context: ./gateway
    restart: unless-stopped
    depends_on:
      stalwart:
        condition: service_healthy
      identity-loopback:
        condition: service_started
    environment:
      PORT: "6402"
      OPENAGENT_IDENTITY_ISSUER: ${OPENAGENT_IDENTITY_ISSUER:-http://127.0.0.1:6201/oidc}
      OPENAGENT_IDENTITY_JWKS_URL: ${OPENAGENT_IDENTITY_JWKS_URL:-http://host.docker.internal:6201/oidc/jwks}
      OPENAGENT_MAIL_AUDIENCE: ${OPENAGENT_MAIL_AUDIENCE:-https://mail.openagent.md}
      OPENAGENT_MAIL_DOMAIN: ${OPENAGENT_MAIL_DOMAIN:-agents.openagent.md}
      LEGACY_AGENT_MAIL_DOMAINS: ${LEGACY_AGENT_MAIL_DOMAINS:-}
      OPENAGENT_REQUIRED_SCOPES: ${OPENAGENT_REQUIRED_SCOPES:-mail:read}
      CAST_MAILBOX_GATEWAY_TOKEN: ${CAST_MAILBOX_GATEWAY_TOKEN:-local-cast-mailbox-gateway-token-change-me}
      CAST_DKIM_SELECTOR: ${CAST_DKIM_SELECTOR:-cast1}
      MAIL_PUBLIC_DELIVERY_CONFIGURED: ${MAIL_PUBLIC_DELIVERY_CONFIGURED:-false}
      STALWART_BASE_URL: http://stalwart:8080
      STALWART_PUBLIC_URL: http://localhost:6401
      STALWART_MAIL_HOST: localhost
      STALWART_SMTP_SUBMISSION_PORT: "6487"
      STALWART_IMAP_PORT: "6493"
      STALWART_ADMIN_USERNAME: ${STALWART_ADMIN_USERNAME:-admin}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:?set STALWART_ADMIN_PASSWORD}
      STALWART_SERVER_HOSTNAME: ${STALWART_SERVER_HOSTNAME:-mail.openagent.md}
      STALWART_REQUEST_TLS_CERTIFICATE: "false"
      STALWART_AUTO_BOOTSTRAP: ${STALWART_AUTO_BOOTSTRAP:-true}
      STALWART_CONFIGURE_OPENAGENT_OIDC: ${STALWART_CONFIGURE_OPENAGENT_OIDC:-true}
      STALWART_CONFIGURE_CAST_MAIL: ${STALWART_CONFIGURE_CAST_MAIL:-true}
    ports:
      - "6402:6402"

volumes:
  stalwart-config:
  stalwart-data:
